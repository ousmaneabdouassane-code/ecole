<style>
body{font-family:system-ui,sans-serif;margin:0;background:#eef2f7;color:#111}

label{font-size:14px;color:#374151}
table{width:100%;border-collapse:collapse;font-size:13px;border-radius:8px;overflow:hidden;table-layout:auto}
td,th{border-bottom:1px solid #99f6e4;padding:6px 5px;text-align:left;vertical-align:top;word-break:break-word}
th{background:#ccfbf1;color:#115e59;font-weight:700;border-bottom:2px solid #14b8a6}
tr:nth-child(even) td{background:#f8fffe}
.mat{font-family:monospace;font-size:20px;letter-spacing:1px;color:#1d4ed8;font-weight:700}
.badge{padding:2px 8px;border-radius:10px;font-size:12px}
.b-ok{background:#dcfce7}.b-part{background:#fef9c3}.b-du{background:#fee2e2}
.ok{background:#dcfce7}.bad{background:#fee2e2}
.center{text-align:center}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:auto}
.key{font-size:24px;padding:16px;margin:0}
.key.ok{background:#16a34a}
small{color:#555}

<body>
<header><div class="t" id="hdr"></div><button class="small" style="background:#ffffff33;width:auto" onclick="logout()">Accueil</button></header>
<main id="app"></main>
<script>
const KEY="ecole_web_v2", OLD="ecole_web_v1";
const SCHOOL="Complexe scolaire";
const CODES={directeur:"1234",secretariat:"2222",surveillant:"3333"};
const LAB={directeur:"Directeur",secretariat:"Secrétariat",surveillant:"Surveillant",professeur:"Professeur"};
const CLASSES=["Maternelle PS","Maternelle MS","Maternelle GS","CP","CE1","CE2","CM1","CM2","6e","5e","4e","3e","2nde","1re A","1re C","1re D","Tle A","Tle C","Tle D"];
const ENS_MAT=["Langage oral","Graphisme","Découverte du monde","Motricité","Éveil artistique"];
const ENS_PRIM=["Français","Mathématiques","Découverte du monde","Anglais","EPS","Arts plastiques","Musique","Éducation civique"];
// Coefficients indicatifs : à vérifier avec le programme officiel
const COEFS={
 COLLEGE:{"Français":5,"Mathématiques":5,"Anglais":3,"Histoire-Géographie":3,"SVT":2,"Physique-Chimie":2,"Technologie":2,"Éducation civique":1,"EPS":1},
 "2nde":{"Français":4,"Mathématiques":5,"Physique-Chimie":3,"SVT":3,"Anglais":2,"Histoire-Géographie":2,"Philosophie":2,"EPS":1},
 A:{"Français":5,"Philosophie":5,"Histoire-Géographie":3,"Langue vivante":3,"Mathématiques":2,"SVT":2,"Éducation civique":1,"EPS":1},
 C:{"Mathématiques":7,"Physique-Chimie":6,"SVT":4,"Français":3,"Philosophie":3,"Anglais":2,"Histoire-Géographie":2,"EPS":1},
 D:{"Mathématiques":6,"Physique-Chimie":5,"SVT":5,"Français":3,"Philosophie":2,"Anglais":2,"Histoire-Géographie":2,"EPS":1}
};
const MODES=["Espèces","Virement","Chèque","MTN Mobile Money","Orange Money","Airtel Money","Moov Money","Wave"];
const DIR="directeur",SEC="secretariat",SURV="surveillant",PROF="professeur",ALL=[DIR,SEC,SURV,PROF];
const PERM={eleves:ALL,fiche:ALL,inscrire:[DIR,SEC],paiement:[DIR,SEC],recu:[DIR,SEC],caisse:[DIR,SEC],profs:[DIR,SEC],inscrire_prof:[DIR,SEC],devoir:[DIR,PROF],notes:[DIR,PROF],classement:[DIR,PROF],bulletin:[DIR,SEC],recherche:[DIR,SEC,SURV],mesdevoirs:[PROF],sauver:[DIR],fiches:[DIR,SEC]};
const TILES={eleves:["Élèves","👥"],inscrire:["Inscrire un élève","➕"],caisse:["Caisse et paiements","💰"],profs:["Professeurs","🧑"],inscrire_prof:["Nouveau professeur","➕"],devoir:["Créer un devoir","📝"],notes:["Saisir les notes","✏️"],classement:["Classement","🏆"],bulletin:["Bulletin annuel","📄"],mesdevoirs:["Mes devoirs","📚"],recherche:["Rechercher","🔎"],fiches:["Fiches d'inscription","🖨️"],sauver:["Sauvegarder","💾"]};

// ---------- Données ----------
function load(){
 let raw=localStorage.getItem(KEY);
 const migrer=!raw;
 if(!raw)raw=localStorage.getItem(OLD);
 const d=raw?JSON.parse(raw):{};
 d.eleves=d.eleves||[];d.profs=d.profs||[];d.devoirs=d.devoirs||[];d.notes=d.notes||[];d.paiements=d.paiements||[];
 d.compteur=d.compteur||{ELV:0,PROF:0,DEV:0};
 if(migrer)d.eleves.forEach(e=>(e.versements||[]).forEach(v=>{
  if(v.paye&&!d.paiements.some(p=>p.mat===e.matricule&&p.numero===v.numero))
   d.paiements.push({id:"REC-"+(d.paiements.length+1).toString().padStart(5,"0"),date:v.date||"",mat:e.matricule,numero:v.numero,mode:"Espèces",montant:v.montant});
 }));
 return d;
}
let db=load();
let S={page:"accueil",role:null,user:null,p:{}};
let flash="",flashErr=false;
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function newMat(p){db.compteur[p]++;return `${p}-${new Date().getFullYear()}-${String(db.compteur[p]).padStart(4,"0")}`;}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function fmt(x){return Number(x||0).toLocaleString("fr-FR");}
function val(id){const el=document.getElementById(id);return el?el.value.trim():"";}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function trouverEleve(m){return db.eleves.find(e=>e.matricule===m)||null;}
function trouver(q){q=(q||"").trim().toUpperCase();return trouverEleve(q)||db.profs.find(p=>p.matricule===q)||null;}
function serie(c){
 if(/^(1re|Tle) A$/.test(c))return "A";
 if(/^(1re|Tle) C$/.test(c))return "C";
 if(/^(1re|Tle) D$/.test(c))return "D";
 if(c==="2nde")return "2nde";
 if(["6e","5e","4e","3e"].includes(c))return "COLLEGE";
 return null;
}
function coefDef(c,m){return ((COEFS[serie(c)]||{})[m])??1;}
function prog(c){
 if(c.startsWith("Maternelle"))return ENS_MAT.map(m=>[m,null]);
 if(["CP","CE1","CE2","CM1","CM2"].includes(c))return ENS_PRIM.map(m=>[m,null]);
 return Object.entries(COEFS[serie(c)]||{});
}
function progHtml(c){return `<p><b>Enseignements (${esc(c)}) :</b><br>`+prog(c).map(([m,k])=>esc(m)+(k!=null?` (coef ${k})`:"")).join("<br>")+`</p>`;}
function paidFor(m,n){return db.paiements.filter(p=>p.mat===m&&p.numero===n).reduce((s,p)=>s+p.montant,0);}
function reste(e,v){return Math.max(0,v.montant-paidFor(e.matricule,v.numero));}
function statut(e,v){const pa=paidFor(e.matricule,v.numero);return pa>=v.montant?'<span class="badge b-ok">Soldé</span>':pa>0?'<span class="badge b-part">Partiel</span>':'<span class="badge b-du">Impayé</span>';}
function totalDu(e){return e.versements.reduce((s,v)=>s+v.montant,0);}
function totalPaye(e){return db.paiements.filter(p=>p.mat===e.matricule).reduce((s,p)=>s+p.montant,0);}
function notesEleve(e){
 const res=[];
 db.devoirs.filter(d=>d.classe===e.niveau).forEach(d=>{
  db.notes.filter(n=>n.devoir===d.matricule&&n.eleve===e.matricule).forEach(n=>res.push([d,n.note]));
 });
 return res;
}
function moyGen(e){
 const n=notesEleve(e);const cf=n.reduce((s,[d])=>s+d.coef,0);
 return cf?Math.round(n.reduce((s,[d,x])=>s+d.coef*x,0)/cf*100)/100:null;
}

// ---------- Navigation ----------
function logo(s){return `<svg width="${s}" height="${s}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#fff"/><path d="M50 20 L80 35 L50 50 L20 35 Z" fill="#1d4ed8"/><path d="M30 42 V62 Q50 75 70 62 V42 L50 52 Z" fill="#1d4ed8"/><rect x="76" y="36" width="3" height="28" fill="#1d4ed8"/></svg>`;}
function render(){
 document.getElementById("hdr").innerHTML=logo(28)+`<span>${SCHOOL}</span>`+(S.role?`<small style="color:#dbeafe">· ${LAB[S.role]}${S.user?" "+esc(S.user.nom):""}</small>`:"");
 document.body.classList.remove('rot');
const f=PAGES[S.page]||PAGES.accueil;
 document.getElementById("app").innerHTML=(flash?`<div class="card ${flashErr?"bad":"ok"}">${esc(flash)}</div>`:"")+f();
 flash="";
}
function msg(t,err){flash=t;flashErr=!!err;}
function go(page,p){
 if(page==="home"&&!S.role)page="accueil";
 const perm=PERM[page];
 if(perm&&!perm.includes(S.role)){msg("Accès non autorisé pour cet espace.",1);page="home";}
 S={...S,page,p:p||{}};
 window.scrollTo(0,0);render();
}
function logout(){S={page:"accueil",role:null,user:null,p:{}};S.pin='';render();}
function oldDoLogin(){
 const r=S.p.role;let user=null;
 if(r===PROF){
  user=db.profs.find(p=>p.matricule===val("lmat").toUpperCase());
  if(!user||(user.code||"0000")!==val("lcode")){msg("Matricule ou code incorrect.",1);return render();}
 }else if(val("lcode")!==CODES[r]){msg("Code incorrect.",1);return render();}
 S.role=r;S.user=user;go("home");
}
function exporter(){
 const a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));
 a.download="ecole_sauvegarde.json";a.click();
 msg("Sauvegarde téléchargée.");render();
}

// ---------- Pages ----------
const PAGES={
accueil(){return `<div class="card center">${logo(90)}<h2>Bienvenue à l'École</h2><p><small>Choisissez votre espace</small></p>
 ${Object.keys(LAB).map(r=>`<button onclick="go('login',{role:'${r}'})">Espace ${LAB[r]}</button>`).join("")}</div>`;},
login(){const r=S.p.role;return `<div class="card center">${logo(70)}<h2>Espace ${LAB[r]}</h2>
 ${r===DIR?bioBlock():""}
 <form onsubmit="event.preventDefault();doLogin()">
 ${r===PROF?`<input id="lmat" placeholder="Matricule (PROF-2026-0001)" autocapitalize="characters">`:""}
 <input id="lcode" type="password" inputmode="numeric" placeholder="Code d'accès" autocomplete="off" style="text-align:center;font-size:22px;letter-spacing:6px">
 <button type="submit">Connexion</button></form>
 <button class="sec" onclick="logout()">Retour</button></div>`;},
home(){
 const tiles=Object.entries(TILES).filter(([k])=>PERM[k].includes(S.role));
 return `<div class="card"><h2>Tableau de bord</h2>${themeSelect()}${S.role===DIR?resumeDirecteur():""}<p><small>${LAB[S.role]}${S.user?" - "+esc(S.user.nom)+" ("+esc(S.user.matiere)+")":""}</small></p></div>
 <div class="grid">${tiles.map(([k,[t,ic]])=>`<button class="tile" onclick="${k==='sauver'?'exporter()':`go('${k}')`}"><span>${ic}</span>${t}</button>`).join("")}</div>
 <button class="sec" onclick="logout()" style="margin-top:12px">Se déconnecter</button>`;},
eleves(){
 const fin=[DIR,SEC].includes(S.role);
 const rows=db.eleves.map(e=>`<tr data-s="${esc((e.matricule+" "+e.nom+" "+e.niveau).toLowerCase())}" style="cursor:pointer" onclick="go('fiche',{m:'${e.matricule}'})"><td class="mat" style="font-size:14px">${e.matricule}</td><td>${esc(e.nom)}</td><td>${esc(e.niveau)}</td>${fin?`<td>${fmt(totalPaye(e))} / ${fmt(totalDu(e))}</td>`:""}</tr>`).join("");
 return `<div class="card"><h2>Élèves (${db.eleves.length})</h2>
 <input placeholder="Rechercher (nom, matricule, classe)" oninput="filtrer(this.value)">
 <table><tr><th>Matricule</th><th>Nom</th><th>Classe</th>${fin?"<th>Payé / Dû</th>":""}</tr><tbody id="tb">${rows}</tbody></table>
 ${db.eleves.length?"":"<p>Aucun élève inscrit.</p>"}</div>
 ${[DIR,SEC].includes(S.role)?`<button onclick="go('inscrire')">Inscrire un élève</button>`:""}
 <button class="sec" onclick="go('home')">Retour</button>`;},
fiche(){
 const e=trouverEleve(S.p.m);
 if(!e)return `<div class="card">Élève introuvable.</div><button class="sec" onclick="go('eleves')">Retour</button>`;
 const fin=![SURV,PROF].includes(S.role);
 const n=notesEleve(e),moy=moyGen(e);
 return `<div class="card center"><small>Matricule</small><div class="mat">${e.matricule}</div><h2>${esc(e.nom)}</h2><p>${esc(e.niveau)}</p></div>
 <div class="card">${progHtml(e.niveau)}</div>
 ${fin?`<div class="card"><h2>Scolarité</h2><table><tr><th>Versement</th><th>Montant</th><th>Payé</th><th>Reste</th><th></th></tr>
 ${e.versements.map(v=>`<tr><td>${esc(v.libelle)}<br>${statut(e,v)}</td><td>${fmt(v.montant)}</td><td>${fmt(paidFor(e.matricule,v.numero))}</td><td>${fmt(reste(e,v))}</td><td>${reste(e,v)>0&&[DIR,SEC].includes(S.role)?`<button class="small" onclick="go('paiement',{m:'${e.matricule}',n:${v.numero}})">Encaisser</button>`:""}</td></tr>`).join("")}
 </table></div>`:""}
 <div class="card"><h2>Notes</h2>${n.length?`<table><tr><th>Devoir</th><th>Matière</th><th>Note</th></tr>${n.map(([d,x])=>`<tr><td>${esc(d.titre)}</td><td>${esc(d.matiere)}</td><td>${x}/20</td></tr>`).join("")}</table><p><b>Moyenne générale : ${moy}/20</b></p>`:"<p>Aucune note.</p>"}</div>
 <div class="grid">${[DIR,SEC,PROF].includes(S.role)?`<button onclick="go('bulletin',{m:'${e.matricule}'})">Bulletin annuel</button>`:""}<button class="sec" onclick="go('eleves')">Retour</button></div>`;},
inscrire(){return `<div class="card"><h2>Inscrire un élève</h2>
 <form onsubmit="event.preventDefault();doInscrire()">
 <label>Nom et prénom</label><input id="nom" required>
 <label>Classe</label><select id="classe">${CLASSES.map(c=>`<option>${c}</option>`).join("")}</select>
 <label>Scolarité annuelle totale</label><input id="total" type="number" required>
 <label>Frais d'inscription</label><input id="frais" type="number" value="0">
 <label>Nombre de versements</label><input id="nb" type="number" value="3" min="1">
 <button type="submit">Inscrire et générer le matricule</button></form>
 <button class="sec" onclick="go('eleves')">Retour</button></div>`;},
paiement(){
 const e=trouverEleve(S.p.m);

// ---------- Empreinte digitale (espace directeur) ----------
function bioKey(){return 'ecole_bio_'+S.p.role+(S.p.role==='professeur'?'_'+(S.p.mat||'').toUpperCase():'');}
function codeOk(){if(S.p.role===PROF){const p=db.profs.find(x=>x.matricule===(S.p.mat||'').toUpperCase());return !!p&&(p.code||'0000')===(S.pin||'');}return (S.pin||'')===CODES[S.p.role];}
function bioBlock(){
 if(!window.PublicKeyCredential)return `<p><small>Empreinte non disponible sur cet appareil ou navigateur. Utilisez le code.</small></p>`;
 return localStorage.getItem(bioKey())
  ?`<button type="button" onclick="bioLogin()">Déverrouiller par empreinte</button>`
  :`<p><small>Saisissez le code, puis activez l'empreinte sur cet appareil.</small></p><button type="button" class="sec" onclick="bioActiver()">Activer l'empreinte</button>`;
}
function b64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)));}
function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function bioActiver(){
 if(!codeOk()){msg("Saisissez d'abord le code du directeur, puis activez l'empreinte.",1);return render();}
 try{
  const cred=await navigator.credentials.create({publicKey:{
   challenge:crypto.getRandomValues(new Uint8Array(32)),
   rp:{name:"École"},
   user:{id:crypto.getRandomValues(new Uint8Array(16)),name:"directeur",displayName:"Directeur"},
   pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
   authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required"},
   timeout:60000}});
  localStorage.setItem(bioKey(),b64(cred.rawId));
  msg("Empreinte activée sur cet appareil.");
 }catch(err){msg("Activation annulée ou impossible sur cet appareil.",1);}
 render();
}
async function bioLogin(){
 try{
  await navigator.credentials.get({publicKey:{
   challenge:crypto.getRandomValues(new Uint8Array(32)),
   allowCredentials:[{type:"public-key",id:unb64(localStorage.getItem(bioKey()))}],
   userVerification:"required",timeout:60000}});
  const pr=S.p.role==='professeur'?db.profs.find(p=>p.matricule===(S.p.mat||'').toUpperCase())||null:null;S.role=S.p.role;S.user=pr;S.pin='';go("home");
 }catch(err){msg("Empreinte non reconnue. Utilisez le code.",1);render();}
}

}
function doInscrire(){
 const nom=val("nom"),classe=val("classe"),total=parseFloat(val("total")),frais=parseFloat(val("frais"))||0,nb=parseInt(val("nb"));
 if(!nom||isNaN(total)||!(nb>=1)){msg("Nom, scolarité et nombre de versements sont obligatoires.",1);return render();}
 const versements=[{numero:0,libelle:"Frais d'inscription",montant:frais}];
 for(let i=1;i<=nb;i++)versements.push({numero:i,libelle:i===1?"1er versement":i+"e versement",montant:Math.round(total/nb*100)/100});
 const e={matricule:newMat("ELV"),nom,niveau:classe,versements};
 db.eleves.push(e);save();
 msg("Élève inscrit. Matricule : "+e.matricule);
 go("recu_insc",{m:e.matricule});
}
function doInscrireProf(){
 const nom=val("pnom"),matiere=val("pmat");
 if(!nom||!matiere){msg("Nom et matière obligatoires.",1);return render();}
 const p={matricule:newMat("PROF"),nom,matiere,code:val("pcode")||"0000"};
 db.profs.push(p);save();
 msg("Professeur enregistré. Matricule : "+p.matricule+" (code : "+p.code+")");
 go("profs");
}
function doPaiement(){
 const e=trouverEleve(val("pel"));
 const n=Number(val("pnum"));
 const v=e&&e.versements.find(x=>x.numero===n);
 const montant=parseFloat(val("pmontant"));
 if(!v){msg("Choisissez un élève et un versement.",1);return render();}
 if(!(montant>0)){msg("Montant invalide.",1);return render();}
 const r=reste(e,v);
 if(montant>r){msg("Le montant dépasse le reste à payer ("+fmt(r)+").",1);return render();}
 const id="REC-"+String(db.paiements.length+1).padStart(5,"0");
 db.paiements.push({id,date:val("pdate")||today(),mat:e.matricule,numero:n,mode:val("pmode"),ref:val("pref"),montant});
 save();
 msg("Paiement de "+fmt(montant)+" enregistré.");
 go("recu",{id});
}
function doDevoir(){
 const p=S.role===PROF?S.user:db.profs.find(x=>x.matricule===val("dprof"));
 const classe=val("dclasse"),titre=val("dtitre");
 if(!p||!titre){msg("Professeur et titre obligatoires.",1);return render();}
 const coef=val("dcoef")!==""?parseFloat(val("dcoef")):coefDef(classe,p.matiere);
 const d={matricule:newMat("DEV"),titre,classe,matiere:p.matiere,prof:p.matricule,profnom:p.nom,coef};
 db.devoirs.push(d);save();
 msg("Devoir créé : "+d.matricule+" ("+classe+", coef "+coef+")");
 go(S.role===PROF?"mesdevoirs":"home");
}
function doNotes(dm,pm){
 const d=db.devoirs.find(x=>x.matricule===dm);
 let n=0;
 db.eleves.filter(e=>e.niveau===d.classe).forEach(e=>{
  const s=val("n_"+e.matricule);
  if(s==="")return;
  const x=parseFloat(s);
  if(!(x>=0&&x<=20))return;
  const ex=db.notes.find(k=>k.devoir===dm&&k.eleve===e.matricule);
  if(ex)ex.note=x;else db.notes.push({devoir:dm,eleve:e.matricule,note:x});
  n++;
 });
 save();
 msg(n+" note(s) enregistrée(s).");
 go("notes",{prof:pm,d:dm});
}

/* ---------- Thèmes ---------- */
function themeSelect(){const t=localStorage.getItem('ecole_theme')||'sombre';const opts=[['sombre','Sombre (bleu nuit)'],['clair','Clair (bleu)'],['vert','Vert'],['or','Or et noir']];return `<label>Thème de l'application</label><select onchange='setTheme(this.value)'>${opts.map(([k,l])=>`<option value='${k}' ${k===t?'selected':''}>${l}</option>`).join('')}</select>`;}
function setTheme(t){localStorage.setItem('ecole_theme',t);document.body.className='th-'+t;}

// Démarrage
document.body.className='th-'+(localStorage.getItem('ecole_theme')||'sombre');
render();
</script>
