<script>
const KEY="ecole_web_v2", OLD="ecole_web_v1";
const SCHOOL="IPPASO Zinder";
const CODES={directeur:"1234",censeur:"4444",secretariat:"2222",surveillant:"3333",chef:"5555",intendant:"6666",infirmerie:"7777",consultation:"8080",parents:"8888"};
const LAB={directeur:"Proviseur",censeur:"Censeur",secretariat:"Secrétariat",surveillant:"Surveillant général",professeur:"Professeur",chef:"Chef de travaux",intendant:"Intendant",infirmerie:"Infirmerie",consultation:"Consultation",parents:"Parents d’élèves"};
const CLASSES=["1re année ASP","2e année ASP","3e année ASP","1re année Tertiaires","2e année Tertiaires","3e année Tertiaires","1re année Industrielles","2e année Industrielles","3e année Industrielles"];
const PRO={"ASP":["Production Animale","Production Végétale","Environnement","Génie Rural","TDR4","Économie Sociale"],"Tertiaires":["Secrétariat Bureautique","Informatique de Gestion","Comptabilité","Économie Familiale","BMEFS","Transformation Agroalimentaire","Hôtellerie - Restauration"],"Industrielles":["Électricité","Plomberie","Mécanique","Construction Métallique","Génie Civil","Bâtiment","Mécanique et réparation auto"]};
const CLASSES_GEN=["Maternelle PS","Maternelle MS","Maternelle GS","CI","CP","CE1","CE2","CM1","CM2","6e","5e","4e","3e","2nde","1re A","1re C","1re D","Tle A","Tle C","Tle D"];
const ENS_MAT=["Langage oral","Graphisme","Découverte du monde","Motricité","Éveil artistique"];
const ENS_PRIM=["Français","Mathématiques","Découverte du monde","Anglais","EPS","Arts plastiques","Musique","Éducation civique"];
// Coefficients indicatifs : à vérifier avec le programme officiel
const COEFS={
 COLLEGE:{"Français":5,"Mathématiques":5,"Anglais":3,"Histoire-Géographie":3,"SVT":2,"Physique-Chimie":2,"Technologie":2,"Éducation civique":1,"EPS":1},
 "2nde":{"Français":4,"Mathématiques":5,"Physique-Chimie":3,"SVT":3,"Anglais":2,"Histoire-Géographie":2,"Philosophie":2,"EPS":1},
 A:{"Français":5,"Philosophie":5,"Histoire-Géographie":3,"Langue vivante":3,"Mathématiques":2,"SVT":2,"Éducation civique":1,"EPS":1},
 C:{"Mathématiques":7,"Physique-Chimie":6,"SVT":4,"Français":3,"Philosophie":3,"Anglais":2,"Histoire-Géographie":2,"EPS":1},
 D:{"Mathématiques":6,"Physique-Chimie":5,"SVT":5,"Français":3,"Philosophie":2,"Anglais":2,"Histoire-Géographie":2,"EPS":1}
};
const MODES=["Espèces","Virement","Chèque","Nita","Amana","MTN Mobile Money","Orange Money","Airtel Money","Moov Money","Wave"];
const MODE_STYLE={"Nita":["#0ea5e9","N"],"Amana":["#16a34a","A"],"Orange Money":["#ff6600","O"],"Airtel Money":["#e11d48","A"],"MTN Mobile Money":["#facc15","M"],"Moov Money":["#2563eb","M"],"Wave":["#1e3a8a","W"]};
function modeLogo(m){const s=MODE_STYLE[m];if(!s)return '';return `<svg width='22' height='22' viewBox='0 0 22 22' style='vertical-align:middle'><rect width='22' height='22' rx='5' fill='${s[0]}'/><text x='11' y='15' font-size='12' font-weight='700' text-anchor='middle' fill='#fff'>${s[1]}</text></svg>`;}
const DIR="directeur",SEC="secretariat",SURV="surveillant",PROF="professeur",ALL=[DIR,SEC,SURV,PROF,'infirmerie'];
const PERM={eleves:ALL,fiche:ALL,inscrire:[DIR,SEC],paiement:[DIR,SEC],recu:[DIR,SEC],caisse:[DIR,SEC],profs:[DIR,SEC],inscrire_prof:[DIR,SEC],devoir:[DIR,PROF],notes:[DIR,PROF],classement:[DIR,PROF,'consultation'],bulletin:[DIR,SEC,'consultation'],recherche:[DIR,SEC,SURV],mesdevoirs:[PROF],sauver:[DIR],fiches:[DIR,SEC],offres:ALL,espaces:ALL,filieres:ALL,travail:ALL,infirmerie:ALL,enfant:['parents'],reglages:[DIR],annuel:[DIR,SEC,PROF,'consultation'],classes:[DIR,SEC,PROF,SURV,'consultation'],coefs:[DIR,SEC,PROF],semestre:[DIR,SEC,PROF,'consultation'],semestre_bull:[DIR,SEC,PROF,'consultation'],matieres:[DIR,PROF]};
const TILES={eleves:["Élèves","👥"],inscrire:["Inscrire un élève","➕"],caisse:["Caisse et paiements","💰"],profs:["Professeurs","🧑"],inscrire_prof:["Nouveau professeur","➕"],devoir:["Créer un devoir","📝"],notes:["Saisir les notes","✏️"],classement:["Classement","🏆"],bulletin:["Bulletin annuel","📄"],mesdevoirs:["Mes devoirs","📚"],recherche:["Rechercher","🔎"],infirmerie:["Infirmerie","🩺"],enfant:["Mon enfant","👪"],semestre:["Semestres","📅"],coefs:["Coefficients","⚖️"],classes:["Par classe","🏫"],matieres:["Par matière","📖"],reglages:["Réglages","⚙️"],annuel:["Bulletins annuels","🏅"],travail:["Travail effectué","✅"],espaces:["Espaces","🏫"],filieres:["Filières","🏭"],offres:["Offres et frais","📋"],fiches:["Fiches d'inscription","🖨️"],sauver:["Sauvegarder","💾"]};

// ---------- Données ----------
function load(){
 let raw=localStorage.getItem(KEY);
 const migrer=!raw;
 if(!raw)raw=localStorage.getItem(OLD);
 const d=raw?JSON.parse(raw):{};
 d.eleves=d.eleves||[];d.profs=d.profs||[];d.devoirs=d.devoirs||[];d.notes=d.notes||[];d.infirmerie=d.infirmerie||[];d.journal=d.journal||[];d.paiements=d.paiements||[];
 d.compteur=d.compteur||{ELV:0,PROF:0,DEV:0};
 if(migrer)d.eleves.forEach(e=>(e.versements||[]).forEach(v=>{
  if(v.paye&&!d.paiements.some(p=>p.mat===e.matricule&&p.numero===v.numero))
   d.paiements.push({id:"REC-"+(d.paiements.length+1).toString().padStart(5,"0"),date:v.date||"",mat:e.matricule,numero:v.numero,mode:"Espèces",montant:v.montant});
 }));
 return d;
}
let db=load();
let S={page:"login",role:null,user:null,p:{role:"directeur",mat:""}};
let flash="",flashErr=false;
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function newMat(p){db.compteur[p]++;return `${p}-${new Date().getFullYear()}-${String(db.compteur[p]).padStart(4,"0")}`;}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function fmt(x){return Number(x||0).toLocaleString("fr-FR");}
function val(id){const el=document.getElementById(id);return el?el.value.trim():"";}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function trouverEleve(m){return db.eleves.find(e=>e.matricule===m)||null;}
function trouver(q){q=(q||"").trim().toUpperCase();return trouverEleve(q)||db.profs.find(p=>p.matricule===q)||null;}
function serie(c){
 if(/^(1re|Tle) A$/.test(c))return "A";
 if(/^(1re|Tle) C$/.test(c))return "C";
 if(/^(1re|Tle) D$/.test(c))return "D";
 if(c==="2nde")return "2nde";
 if(["6e","5e","4e","3e"].includes(c))return "COLLEGE";
 return null;
}
function coefDef(c,m){const p=coefPro(c,m);if(p!=null)return p;return ((COEFS[serie(c)]||{})[m])??1;}
function prog(c){
 const fil=Object.keys(PRO).find(f=>c.includes(f));
 if(fil)return PRO[fil].map(m=>[m,null]);
 if(c.startsWith("Maternelle"))return ENS_MAT.map(m=>[m,null]);
 if(["CI","CP","CE1","CE2","CM1","CM2"].includes(c))return ENS_PRIM.map(m=>[m,null]);
 return Object.entries(COEFS[serie(c)]||{});
}
function progHtml(c){return `<p><b>Enseignements (${esc(c)}) :</b><br>`+prog(c).map(([m,k])=>esc(m)+(k!=null?` (coef ${k})`:"")).join("<br>")+`</p>`;}
function paidFor(m,n){return db.paiements.filter(p=>p.mat===m&&p.numero===n).reduce((s,p)=>s+p.montant,0);}
function reste(e,v){return Math.max(0,v.montant-paidFor(e.matricule,v.numero));}
function statut(e,v){const pa=paidFor(e.matricule,v.numero);return pa>=v.montant?'<span class="badge b-ok">Soldé</span>':pa>0?'<span class="badge b-part">Partiel</span>':'<span class="badge b-du">Impayé</span>';}
function totalDu(e){return e.versements.reduce((s,v)=>s+v.montant,0);}
function totalPaye(e){return db.paiements.filter(p=>p.mat===e.matricule).reduce((s,p)=>s+p.montant,0);}
function notesEleve(e){
 const res=[];
 db.devoirs.filter(d=>d.classe===e.niveau&&(!SEM||(d.semestre||'1')===SEM)).forEach(d=>{
  db.notes.filter(n=>n.devoir===d.matricule&&n.eleve===e.matricule).forEach(n=>res.push([d,n.note]));
 });
 return res;
}
function moyGen(e){
 const n=notesEleve(e);const cf=n.reduce((s,[d])=>s+d.coef,0);
 return cf?Math.round(n.reduce((s,[d,x])=>s+d.coef*x,0)/cf*100)/100:null;
}

// ---------- Empreinte digitale (espace directeur) ----------
function bioKey(){return 'ecole_bio_'+S.p.role+(S.p.role==='professeur'?'_'+(S.p.mat||'').toUpperCase():'');}
function codeOk(){if(S.p.role===PROF){const p=db.profs.find(x=>x.matricule===(S.p.mat||'').toUpperCase());return !!p&&(p.code||'0000')===(S.pin||'');}return (S.pin||'')===codeOf(S.p.role);}
function bioBlock(){if(S.p.role==='entree')return '';
 if(!window.PublicKeyCredential)return `<p><small>Empreinte non disponible sur cet appareil ou navigateur. Utilisez le code.</small></p>`;
 return localStorage.getItem(bioKey())
  ?`<button type="button" onclick="bioLogin()">Déverrouiller par empreinte</button>`
  :`<p><small>Saisissez le code, puis activez l'empreinte sur cet appareil.</small></p><button type="button" class="sec" onclick="bioActiver()">Activer l'empreinte</button>`;
}
function b64(buf){return btoa(String.fromCharCode(...new Uint8Array(buf)));}
function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function bioActiver(){
 if(!codeOk()){msg("Saisissez d'abord le code du directeur, puis activez l'empreinte.",1);return render();}
 try{
  const cred=await navigator.credentials.create({publicKey:{
   challenge:crypto.getRandomValues(new Uint8Array(32)),
   rp:{name:"École"},
   user:{id:crypto.getRandomValues(new Uint8Array(16)),name:"directeur",displayName:"Directeur"},
   pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
   authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required"},
   timeout:60000}});
  localStorage.setItem(bioKey(),b64(cred.rawId));
  msg("Empreinte activée sur cet appareil.");
 }catch(err){msg("Activation annulée ou impossible sur cet appareil.",1);}
 render();
}
async function bioLogin(){
 try{
  await navigator.credentials.get({publicKey:{
   challenge:crypto.getRandomValues(new Uint8Array(32)),
   allowCredentials:[{type:"public-key",id:unb64(localStorage.getItem(bioKey()))}],
   userVerification:"required",timeout:60000}});
  const pr=S.p.role==='professeur'?db.profs.find(p=>p.matricule===(S.p.mat||'').toUpperCase())||null:null;S.role=S.p.role;S.user=pr;S.pin='';go("home");
 }catch(err){msg("Empreinte non reconnue. Utilisez le code.",1);render();}
}

 if(r===PROF){

}

 ${mats.length?`<table><tr><th>Matière</th><th>Devoirs</th><th>Moyenne</th></tr>${mats.map(([m])=>{const ds=db.devoirs.filter(d=>d.classe===c&&d.matiere===m);const ns=ds.flatMap(d=>db.notes.filter(n=>n.devoir===d.matricule).map(n=>n.note));const moy=ns.length?Math.round(ns.reduce((a,b)=>a+b,0)/ns.length*100)/100:'-';return `<tr><td>${esc(m)}</td><td>${ds.length}</td><td>${moy}</td></tr>`;}).join('')}</table>`:'<p>Aucune matière.</p>'}
 <h3 style='font-size:16px'>Élèves</h3>
 ${eleves.length?`<table><tr><th>Matricule</th><th>Nom</th><th>Moyenne</th></tr>${eleves.map(e=>`<tr style='cursor:pointer' onclick='go("fiche",{m:"${e.matricule}"})'><td class='mat' style='font-size:12px'>${e.matricule}</td><td>${esc(e.nom)}</td><td>${moyGen(e)===null?'-':moyGen(e)}</td></tr>`).join('')}</table>`:'<p>Aucun élève.</p>'}
 </div><button class='sec' onclick='go("home")'>Retour</button>`;
}
function pageParMatiere(){
 const mats=[...new Set([...db.devoirs.map(d=>d.matiere),...db.profs.map(p=>p.matiere)])].sort();
 const m=S.p.m||mats[0];
 const ds=db.devoirs.filter(d=>d.matiere===m);
 const boutons=mats.map(x=>`<button class='small' style='width:auto;margin:3px;padding:6px 8px;${x===m?'':'opacity:.7'}' onclick='go("matieres",{m:decodeURIComponent("${encodeURIComponent(x)}")})'>${esc(x)}</button>`).join('');
 const profs=[...new Set(db.profs.filter(p=>p.matiere===m).map(p=>p.nom))].join(', ')||'-';
 return `<div class='card'><h2>Par matière</h2><div>${boutons||'<p>Aucune matière.</p>'}</div></div>
 <div class='card'><h2>${esc(m||'')}</h2><p><small>Professeur(s) : ${esc(profs)}</small></p>
 ${ds.length?`<table><tr><th>Devoir</th><th>Classe</th><th>Professeur</th><th>Coef</th><th>Notes</th><th>Moyenne</th></tr>${ds.map(d=>{const ns=db.notes.filter(n=>n.devoir===d.matricule).map(n=>n.note);const moy=ns.length?Math.round(ns.reduce((a,b)=>a+b,0)/ns.length*100)/100:'-';return `<tr><td>${esc(d.titre)}</td><td>${esc(d.classe)}</td><td>${esc(d.profnom)}</td><td>${d.coef}</td><td>${ns.length}</td><td>${moy}</td></tr>`;}).join('')}</table>`:'<p>Aucun devoir pour cette matière.</p>'}
 </div><button class='sec' onclick='go("home")'>Retour</button>`;
}
function pageEnfant(){S.p.m=S.user.matricule;return PAGES.fiche();}
PAGES.annuel=pageAnnuel;const GEN_PRO={"Français":[2,2,2],"Mathématiques":[2,2,2],"Anglais":[1,1,1],"Éducation civique":[1,1,1],"EPS":[1,1,1]};
const TECH_PRO={"ASP":{"Production Animale":[4,5,5],"Production Végétale":[4,5,5],"Environnement":[3,4,4],"Génie Rural":[4,4,5],"TDR4":[3,3,3],"Économie Sociale":[3,3,4]},"Tertiaires":{"Secrétariat Bureautique":[4,5,5],"Informatique de Gestion":[4,5,5],"Comptabilité":[4,4,5],"Économie Familiale":[3,3,3],"BMEFS":[3,3,3],"Transformation Agroalimentaire":[3,4,4],"Hôtellerie - Restauration":[4,4,5]},"Industrielles":{"Électricité":[4,5,6],"Plomberie":[4,4,5],"Mécanique":[4,5,5],"Construction Métallique":[4,4,5],"Génie Civil":[4,5,6],"Bâtiment":[4,4,5],"Mécanique et réparation auto":[4,5,5]}};
function filiereOf(c){return Object.keys(TECH_PRO).find(f=>c.includes(f))||null;}
function anneeOf(c){return c.startsWith('1re')?0:c.startsWith('2e')?1:c.startsWith('3e')?2:null;}
function coefPro(c,m){const f=filiereOf(c),a=anneeOf(c);if(f===null||a===null)return null;if(TECH_PRO[f][m])return TECH_PRO[f][m][a];if(GEN_PRO[m])return GEN_PRO[m][a];return null;}
function pageCoefs(){
 const f=S.p.f||'ASP';
 const tabs=Object.keys(TECH_PRO).map(x=>`<button class='small' style='width:auto;margin:3px;padding:8px 10px;${x===f?'':'opacity:.6'}' onclick='go("coefs",{f:"${x}"})'>${x}</button>`).join('');
 const lignes=[...Object.entries(TECH_PRO[f]),...Object.entries(GEN_PRO)];
 return `<div class='card'><h2>Coefficients par année</h2><div>${tabs}</div><p><small>Valeurs indicatives, à faire valider par l’institut.</small></p>
 <table><tr><th>Matière</th><th>1re année</th><th>2e année</th><th>3e année</th></tr>${lignes.map(([m,v])=>`<tr><td>${esc(m)}</td>${v.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div>
 <button class='sec' onclick='go("home")'>Retour</button>`;
}
let SEM=null;
function pageSemestre(){
 try{
  SEM=S.p.s||'1';
  const c=S.p.c||CLASSES[0];
  const rows=db.eleves.filter(e=>e.niveau===c).map(e=>({e,m:moyGen(e)})).sort((a,b)=>(a.m===null)-(b.m===null)||(b.m||0)-(a.m||0));
  const sems=['1','2'].map(s=>`<button class='small' style='width:auto;margin:3px;padding:8px 12px;${s===SEM?'':'opacity:.6'}' onclick='go("semestre",{s:"${s}",c:"${c}"})'>Semestre ${s}</button>`).join('');
  const cls=CLASSES.map(x=>`<button class='small' style='width:auto;margin:3px;padding:6px 8px;${x===c?'':'opacity:.6'}' onclick='go("semestre",{s:"${SEM}",c:"${x}"})'>${x}</button>`).join('');
  return `<div class='card'><h2>Bulletins et classement semestriels</h2><div>${sems}</div><div>${cls}</div></div>
  <div class='card'><h2>Classement ${esc(c)} - Semestre ${SEM}</h2>${rows.length?`<table><tr><th>Rang</th><th>Élève</th><th>Moyenne</th><th>Mention</th></tr>${rows.map((r,i)=>`<tr style='cursor:pointer' onclick='go("semestre_bull",{m:"${r.e.matricule}",s:"${SEM}"})'><td>${r.m===null?'-':(i+1)+'e'}</td><td>${esc(r.e.nom)}</td><td>${r.m===null?'-':r.m}/20</td><td>${mention(r.m)}</td></tr>`).join('')}</table>`:'<p>Aucun élève dans cette classe.</p>'}</div>
  <button class='sec' onclick='go("home")'>Retour</button>`;
 }finally{SEM=null;}
}
function pageSemBull(){
 try{
  SEM=S.p.s||'1';
  const e=trouverEleve(S.p.m);
  if(!e)return "<div class='card'>Élève introuvable.</div>";
  const grp={};
  notesEleve(e).forEach(([d,n])=>{const g=grp[d.matiere]=grp[d.matiere]||{mat:d.matiere,prof:d.profnom,somme:0,cf:0};g.somme+=n*d.coef;g.cf+=d.coef;});
  const lignes=Object.values(grp);
  const moy=moyGen(e);
  return `<div class='card'><div class='center'>${logo(56)}<h2>BULLETIN SEMESTRIEL ${SEM}</h2><small>${SCHOOL}</small></div>
  <p><b>${esc(e.nom)}</b> - <span class='mat' style='font-size:16px'>${e.matricule}</span><br>Classe : ${esc(e.niveau)}</p>
  ${lignes.length?`<table><tr><th>Matière</th><th>Professeur</th><th>Moyenne</th></tr>${lignes.map(l=>`<tr><td>${esc(l.mat)}</td><td>${esc(l.prof)}</td><td>${Math.round(l.somme/l.cf*100)/100}/20</td></tr>`).join('')}</table><p><b>Moyenne du semestre : ${moy===null?'-':moy}/20</b> - ${mention(moy)}</p>`:'<p>Aucune note pour ce semestre.</p>'}</div>
  <div class='grid'><button onclick='window.print()'>Imprimer</button><button class='sec' onclick='go("semestre",{s:"${SEM}",c:"${e.niveau}"})'>Retour au classement</button></div>`;
 }finally{SEM=null;}
}
PAGES.enfant=pageEnfant;PAGES.coefs=pageCoefs;PAGES.semestre=pageSemestre;PAGES.semestre_bull=pageSemBull;PAGES.classes=pageParClasse;PAGES.matieres=pageParMatiere;

// ---------- Actions ----------
function filtrer(q){
 q=q.toLowerCase();
 document.querySelectorAll("#tb tr").forEach(r=>r.style.display=r.dataset.s.includes(q)?"":"none");
}
function doInscrire(){
 const nom=val("nom"),classe=val("classe"),total=parseFloat(val("total")),frais=parseFloat(val("frais"))||0,nb=parseInt(val("nb"));
 if(!nom||isNaN(total)||!(nb>=1)){msg("Nom, scolarité et nombre de versements sont obligatoires.",1);return render();}
 const versements=[{numero:0,libelle:"Frais d'inscription",montant:frais}];
 for(let i=1;i<=nb;i++)versements.push({numero:i,libelle:i===1?"1er versement":i+"e versement",montant:Math.round(total/nb*100)/100});
 const e={matricule:newMat("ELV"),nom,niveau:classe,versements};
 db.eleves.push(e);save();
 msg("Élève inscrit. Matricule : "+e.matricule);
 go("recu_insc",{m:e.matricule});
}
function doInscrireProf(){
 const nom=val("pnom"),matiere=val("pmat");
 if(!nom||!matiere){msg("Nom et matière obligatoires.",1);return render();}
 const p={matricule:newMat("PROF"),nom,matiere,code:val("pcode")||"0000"};
 db.profs.push(p);save();
 msg("Professeur enregistré. Matricule : "+p.matricule+" (code : "+p.code+")");
 go("profs");
}
function doPaiement(){
 const e=trouverEleve(val("pel"));
 const n=Number(val("pnum"));
 const v=e&&e.versements.find(x=>x.numero===n);
 const montant=parseFloat(val("pmontant"));
 if(!v){msg("Choisissez un élève et un versement.",1);return render();}
 if(!(montant>0)){msg("Montant invalide.",1);return render();}
 const r=reste(e,v);
 if(montant>r){msg("Le montant dépasse le reste à payer ("+fmt(r)+").",1);return render();}
 const id="REC-"+String(db.paiements.length+1).padStart(5,"0");
 db.paiements.push({id,date:val("pdate")||today(),mat:e.matricule,numero:n,mode:val("pmode"),ref:val("pref"),montant});
 save();
 msg("Paiement de "+fmt(montant)+" enregistré.");
 go("recu",{id});
}
function doDevoir(){
 const p=S.role===PROF?S.user:db.profs.find(x=>x.matricule===val("dprof"));
 const classe=val("dclasse"),titre=val("dtitre");
 if(!p||!titre){msg("Professeur et titre obligatoires.",1);return render();}
 const coef=val("dcoef")!==""?parseFloat(val("dcoef")):coefDef(classe,p.matiere);
 const d={matricule:newMat("DEV"),titre,classe,matiere:p.matiere,prof:p.matricule,profnom:p.nom,coef,semestre:val('dsem')||'1'};
 db.devoirs.push(d);save();
 msg("Devoir créé : "+d.matricule+" ("+classe+", coef "+coef+")");
 go(S.role===PROF?"mesdevoirs":"home");
}
function doNotes(dm,pm){
 const d=db.devoirs.find(x=>x.matricule===dm);
 let n=0;
 db.eleves.filter(e=>e.niveau===d.classe).forEach(e=>{
  const s=val("n_"+e.matricule);
  if(s==="")return;
  const x=parseFloat(s);
  if(!(x>=0&&x<=20))return;
  const ex=db.notes.find(k=>k.devoir===dm&&k.eleve===e.matricule);
  if(ex)ex.note=x;else db.notes.push({devoir:dm,eleve:e.matricule,note:x});
  n++;
 });
 save();
 msg(n+" note(s) enregistrée(s).");
 go("notes",{prof:pm,d:dm});
}

/* ---------- Thèmes ---------- */
function themeSelect(){const t=localStorage.getItem('ecole_theme')||'ippaso';const opts=[['ippaso','IPPASO (bleu et orange)'],['ardoise','Ardoise (gris et turquoise)'],['sable','Sable (beige et brun)'],['vert','Vert']];return `<label>Thème de l'application</label><select onchange='setTheme(this.value)'>${opts.map(([k,l])=>`<option value='${k}' ${k===t?'selected':''}>${l}</option>`).join('')}</select>`;}
function setTheme(t){localStorage.setItem('ecole_theme',t);document.body.className='th-'+t;}

/* ---------- Glisser pour changer d'espace ---------- */
const ORDRE_ESPACES=['directeur','censeur','secretariat','surveillant','chef','intendant','infirmerie','consultation','parents','professeur'];
let _tx=null;
document.addEventListener('touchstart',e=>{_tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{
 if(_tx===null||!['login','home'].includes(S.page))return;
 const dx=e.changedTouches[0].clientX-_tx;_tx=null;
 if(Math.abs(dx)<60)return;
 const i=ORDRE_ESPACES.indexOf(S.page==='login'?S.p.role:S.role);
 const n=dx<0?(i+1)%ORDRE_ESPACES.length:(i-1+ORDRE_ESPACES.length)%ORDRE_ESPACES.length;
 slideTo(n,dx<0?1:-1);
},{passive:true});

function slideTo(n,dir){
 const app=document.getElementById('app');
 app.style.transition='transform .25s ease, opacity .25s';app.style.transform='translateX('+(dir*-40)+'px)';app.style.opacity='0';
 setTimeout(()=>{
  startLogin(ORDRE_ESPACES[n]);
  const a=document.getElementById('app');
  a.style.transition='none';a.style.transform='translateX('+(dir*40)+'px)';a.style.opacity='0';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{a.style.transition='transform .25s ease, opacity .25s';a.style.transform='translateX(0)';a.style.opacity='1';}));
 },250);
}
// Démarrage
document.body.className='th-'+(localStorage.getItem('ecole_theme')||'ippaso');
render();
</script>
